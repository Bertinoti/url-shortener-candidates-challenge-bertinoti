services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUBLIC_URL=http://localhost:3000
      - DATA_FILE=data/urls.json
    volumes:
      - url-data:/app/applications/web/data

volumes:
  url-data:
